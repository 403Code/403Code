<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Bumper Text Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent; /* wajib transparan */
    overflow: hidden;
    font-family: 'Cinzel', 'Times New Roman', serif;
  }

  /* Container utama di tengah */
  .bumper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
  }

  /* Teks utama */
  .bumper-text {
    font-size: 3.2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #d9d9d9;

    /* Efek ukiran gelap ala ilustrasi */
    text-shadow:
      0 0 4px #000,
      0 0 10px #000,
      0 0 20px rgba(0,0,0,0.9),
      2px 2px 0 #1a1a1a,
      -1px -1px 0 #4a4a4a;

    opacity: 0;
    animation: fadeSwap 8s infinite;
  }

  /* Kalimat kedua muncul setelah kalimat pertama */
  .bumper-text:nth-child(2) {
    animation-delay: 4s;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  /* Garis dekoratif ala sarang laba-laba / radial */
  .bumper::before,
  .bumper::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(200, 200, 200, 0.15);
    border-radius: 50%;
    pointer-events: none;
  }

  .bumper::before {
    width: 120%;
    height: 120%;
  }

  .bumper::after {
    width: 160%;
    height: 160%;
    border-style: dashed;
    border-color: rgba(200, 200, 200, 0.08);
  }

  /* Animasi fade in-out bergantian */
  @keyframes fadeSwap {
    0%   { opacity: 0; transform: translateY(10px); }
    10%  { opacity: 1; transform: translateY(0); }
    40%  { opacity: 1; transform: translateY(0); }
    50%  { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; transform: translateY(-10px); }
  }
</style>
</head>
<body>

  <div class="bumper">
    <div class="bumper-text">JOIN VIA ROBLOX USERNAME @DEMENTORIZE</div>
    <div class="bumper-text">LINK DISCORD &amp; DONATE IN BIO</div>
  </div>

</body>
</html>
