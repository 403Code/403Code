
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gothic Server Status</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: transparent;
  font-family: 'Cinzel', serif;
}

.gothic-panel {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 17px 25px;
  min-width: 350px;
  background: linear-gradient(
    135deg,
    rgba(12,12,15,.97),
    rgba(24,22,26,.96),
    rgba(8,8,10,.97)
  );

  border: 1px solid #62504a;
  outline: 1px solid rgba(180,145,120,.18);
  outline-offset: 4px;

  clip-path: polygon(
    0 12%, 5% 12%, 8% 0,
    92% 0, 95% 12%, 100% 12%,
    100% 88%, 95% 88%, 92% 100%,
    8% 100%, 5% 88%, 0 88%
  );

  box-shadow:
    0 0 20px rgba(120,0,0,.2),
    inset 0 0 25px rgba(0,0,0,.9);
}

.gothic-panel::before,
.gothic-panel::after {
  content: "✦";
  position: absolute;
  color: #a52d35;
  font-size: 13px;
}

.gothic-panel::before {
  top: 5px;
  left: 12px;
}

.gothic-panel::after {
  bottom: 5px;
  right: 12px;
}

.indicator-frame {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border: 1px solid #77615c;
  transform: rotate(45deg);
}

.indicator {
  width: 11px;
  height: 11px;
  background: #22c55e;
  box-shadow: 0 0 12px currentColor;
  transform: rotate(-45deg);
  border-radius: 50%;
}

.server-label {
  color: #c9b9ae;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 3px;
  text-shadow: 0 0 8px rgba(180,150,130,.3);
}

.status {
  min-width: 110px;
  padding: 7px 13px;
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  border: 1px solid;
  background: rgba(0,0,0,.45);
}

.public {
  color: #55e8a1;
  border-color: #247b54;
  text-shadow: 0 0 10px rgba(34,197,94,.6);
  box-shadow: inset 0 0 12px rgba(34,197,94,.1);
}

.private {
  color: #ff5967;
  border-color: #8f2732;
  text-shadow: 0 0 10px rgba(239,68,68,.6);
  box-shadow: inset 0 0 12px rgba(239,68,68,.1);
}

.offline {
  color: #aaa;
  border-color: #555;
}

.indicator.public-dot {
  background: #22c55e;
  color: #22c55e;
}

.indicator.private-dot {
  background: #ef4444;
  color: #ef4444;
}

.indicator.offline-dot {
  background: #888;
  color: #888;
}
</style>
</head>

<body>

<div class="gothic-panel">

  <div class="indicator-frame">
    <div class="indicator" id="indicator"></div>
  </div>

  <div class="server-label">SERVER:</div>

  <div class="status offline" id="status">
    LOADING
  </div>

</div>

<script>
const DATABASE_URL =
  "https://overlay-stream-c8e76-default-rtdb.asia-southeast1.firebasedatabase.app/";

async function updateStatus() {
  const badge = document.getElementById("status");
  const indicator = document.getElementById("indicator");

  try {
    const response = await fetch(
      `${DATABASE_URL}/serverStatus/status.json`,
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Database error");

    const value = (await response.json())?.toUpperCase();

    badge.className = "status";
    indicator.className = "indicator";

    if (value === "PUBLIC") {
      badge.textContent = "PUBLIC";
      badge.classList.add("public");
      indicator.classList.add("public-dot");

    } else if (value === "PRIVATE") {
      badge.textContent = "PRIVATE";
      badge.classList.add("private");
      indicator.classList.add("private-dot");

    } else {
      throw new Error("Invalid server status");
    }

  } catch (error) {
    badge.textContent = "OFFLINE";
    badge.className = "status offline";
    indicator.className = "indicator offline-dot";

    console.error(error);
  }
}

updateStatus();
setInterval(updateStatus, 5000);
</script>

</body>
</html>
